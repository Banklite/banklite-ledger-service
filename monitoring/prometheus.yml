# Configuracion de Prometheus para banklite-ledger-service.
# Modelo pull: cada 15 segundos Prometheus consulta GET /metrics del servicio desplegado en Render.
global:
  scrape_interval: 15s      # cada cuanto se consultan las metricas
  evaluation_interval: 15s  # cada cuanto se evaluan las reglas de alerta

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: banklite-ledger-service
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['banklite-ledger-service.onrender.com']

  # Para vigilar el servicio corriendo en tu maquina (uvicorn en el puerto 8003),
  # reemplaza el bloque anterior por este:
  # - job_name: banklite-ledger-service
  #   static_configs:
  #     - targets: ['host.docker.internal:8003']
